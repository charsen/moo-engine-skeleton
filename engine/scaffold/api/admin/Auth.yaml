controller:
    code:
    class: 'Auth'
    name: '登录鉴权'
    desc: []
actions:
    authenticate_post:
        name: '登录'
        desc:
            - '校验帐号密码 → 手动签发 JWT。'
        prototype: ''
        request: [POST, api/admin/authenticate]
        meta:
            creator: 'charsen'
            created_at: '2026-08-11 00:00:00'
            updated_by: ''
            updated_at: ''
        url_params: []
        body_params: []
    logout_post:
        name: '退出登录'
        desc:
            - '拉黑当前 token。'
            - '路由是公开的（不挂 JWT 中间件）。无 token / 垃圾 token 也不会 500：'
            - 'JWTGuard::logout() 内部自己捕获了 JWTException（拉黑不了就当作已登出），'
            - '所以本接口对任何输入都幂等返回 200——RegressionTest 守护了这个契约。'
        prototype: ''
        request: [POST, api/admin/logout]
        meta:
            creator: 'charsen'
            created_at: '2026-08-11 00:00:00'
            updated_by: ''
            updated_at: ''
        url_params: []
        body_params: []
    me_get:
        name: '登录用户信息'
        desc: []
        prototype: ''
        request: [GET, api/admin/me/info]
        meta:
            creator: 'charsen'
            created_at: '2026-08-11 00:00:00'
            updated_by: ''
            updated_at: ''
        url_params: []
        body_params: []
    refresh_post:
        name: '刷新 token'
        desc:
            - '本路由**故意不挂** jwt.auth.refresh（见 routes/admin.php）：那个中间件会先对过期'
            - 'token 自动续签一次，控制器再续签第二次 —— 一个旧 token 派生出两个有效新 token，'
            - '响应头和响应体各一个，前者永远不会被作废（孤儿 token）。refresh 自己就支持'
            - '过期 token（只要在续期窗口内），这里独立完成唯一的一次续签。'
        prototype: ''
        request: [POST, api/admin/refresh]
        meta:
            creator: 'charsen'
            created_at: '2026-08-11 00:00:00'
            updated_by: ''
            updated_at: ''
        url_params: []
        body_params: []
